<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>УЧИМСЯ ИГРАЮЧИ — Меню</title>

<!-- ШРИФТЫ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --dirt:#7a4f2a;  --grass:#67b93c; --stone:#8d8d8d;
  --dark:#161009;  --panel:#241a10; --panel2:#332415;
  --gold:#ffc93c;  --diamond:#43e0c0; --xp:#8cf54a;
  --red:#e5483f;   --ink:#fff7e0;
  --px-font:'Press Start 2P','Courier New',monospace;
  --body-font:'Rubik','Segoe UI',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  font-family:var(--body-font); color:var(--ink);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
  overflow-x:hidden;
  background:
    radial-gradient(900px 480px at 50% -8%, rgba(255,190,90,.10), transparent 60%),
    repeating-linear-gradient(0deg,  rgba(0,0,0,.28) 0 3px, transparent 3px 48px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 3px, transparent 3px 48px),
    linear-gradient(180deg,#2c2013 0%, #1b130a 55%, #0d0805 100%);
  min-height:100dvh;
}
.px{font-family:var(--px-font); image-rendering:pixelated;}

/* Кнопки в стиле Minecraft */
.btn-mc{
  font-family:var(--px-font); font-size:14px; line-height:1.5;
  color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.6);
  background:linear-gradient(#9c9c9c,#6e6e6e);
  border:3px solid #000; padding:14px 18px; cursor:pointer;
  box-shadow:inset 0 4px 0 #c9c9c9, inset 0 -6px 0 #4a4a4a, 0 5px 0 #000;
  transition:transform .05s;
}
.btn-mc:hover{color:#ffe95e; filter:brightness(1.08);}
.btn-mc:active{transform:translateY(4px); box-shadow:inset 0 4px 0 #c9c9c9, inset 0 -6px 0 #4a4a4a, 0 1px 0 #000;}
.btn-mc:disabled{opacity:.55; cursor:default;}
.btn-green{background:linear-gradient(#71c748,#4c9a2a); box-shadow:inset 0 4px 0 #a9ea7f, inset 0 -6px 0 #33651d, 0 5px 0 #000;}
.btn-green:active{box-shadow:inset 0 4px 0 #a9ea7f, inset 0 -6px 0 #33651d, 0 1px 0 #000;}
.btn-gold{background:linear-gradient(#ffcf52,#d99a13); color:#3a2500; text-shadow:1px 1px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 4px 0 #ffe59a, inset 0 -6px 0 #9c6d05, 0 5px 0 #000;}
.btn-gold:active{box-shadow:inset 0 4px 0 #ffe59a, inset 0 -6px 0 #9c6d05, 0 1px 0 #000;}
.btn-red{background:linear-gradient(#e5483f,#b9362e); box-shadow:inset 0 4px 0 #ff8a7f, inset 0 -6px 0 #7a241d, 0 5px 0 #000;}
.btn-red:active{box-shadow:inset 0 4px 0 #ff8a7f, inset 0 -6px 0 #7a241d, 0 1px 0 #000;}

/* Экран меню */
#screen-menu{min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px;}
.logo{font-family:var(--px-font); font-size:clamp(22px,5vw,48px); text-align:center; line-height:1.25;
  color:#fff; text-shadow:4px 4px 0 #3f3f3f, 8px 8px 0 rgba(0,0,0,.45); letter-spacing:2px;}
.logo b{color:var(--gold); text-shadow:4px 4px 0 #7a5a00, 8px 8px 0 rgba(0,0,0,.45);}
.menu-desc{max-width:560px; text-align:center; font-size:15px; color:#c9b28f;}

/* Карточки режимов */
.mode-cards{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:700px;}
.mode-card{
  background:var(--panel2); border:4px solid #000;
  box-shadow:inset 0 0 0 3px #5b4426, 0 10px 0 #000;
  padding:24px; width:280px; text-align:center;
  display:flex; flex-direction:column; gap:16px; align-items:center;
  transition:transform .15s, box-shadow .15s;
  cursor:pointer;
}
.mode-card:hover{transform:translateY(-6px); box-shadow:inset 0 0 0 3px #7a5a26, 0 16px 0 #000;}
.mode-card .icon{font-size:64px; margin-bottom:8px;}
.mode-card h3{font-family:var(--px-font); font-size:16px; color:var(--gold); text-shadow:2px 2px 0 #000;}
.mode-card p{font-size:13px; color:#b9a28a; line-height:1.5;}
.mode-card .btn-mc{margin-top:8px; font-size:12px; padding:12px 16px;}

/* Адаптив для мобильных */
@media(max-width:640px){
  .mode-cards{flex-direction:column; align-items:center;}
  .mode-card{width:min(92vw,280px);}
}
</style>
</head>
<body>

<section id="screen-menu">
  <h1 class="logo">УЧИМСЯ<br><b>ИГРАЮЧИ</b></h1>
  <p class="menu-desc">Выбери режим обучения:</p>
  
  <div class="mode-cards">
    <!-- Карточка таблицы умножения -->
    <div class="mode-card" id="card-multiply">
      <div class="icon">✖️</div>
      <h3>ТАБЛИЦА УМНОЖЕНИЯ</h3>
      <p>Решай примеры на умножение, ломай блоки и добывай ресурсы!</p>
      <button class="btn-mc btn-green" data-mode="multiply">▶ ИГРАТЬ</button>
    </div>
    
    <!-- Карточка русского алфавита -->
    <div class="mode-card" id="card-alphabet">
      <div class="icon">🅰️</div>
      <h3>РУССКИЙ АЛФАВИТ</h3>
      <p>Изучай буквы русского алфавита в увлекательной игре!</p>
      <button class="btn-mc btn-gold" data-mode="alphabet">▶ ИГРАТЬ</button>
    </div>
  </div>
  
  <p class="menu-desc" style="font-size:12px; opacity:.6; margin-top:20px;">
    💡 Совет: переключайся между режимами, чтобы разнообразить обучение!
  </p>
</section>

<script>
// Переход к выбранному режиму
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const mode = btn.dataset.mode;
    window.location.href = mode === 'multiply' ? 'multiply.html' : 'alphabet.html';
  });
});

// Клик по карточке тоже запускает игру
document.querySelectorAll('.mode-card').forEach(card => {
  card.addEventListener('click', () => {
    const btn = card.querySelector('[data-mode]');
    if(btn) {
      const mode = btn.dataset.mode;
      window.location.href = mode === 'multiply' ? 'multiply.html' : 'alphabet.html';
    }
  });
});
</script>

</body>
</html>
