<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблица умножения — УЧИМСЯ ИГРАЮЧИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --dirt:#7a4f2a; --grass:#67b93c; --stone:#8d8d8d;
  --dark:#161009; --panel:#241a10; --panel2:#332415;
  --gold:#ffc93c; --diamond:#43e0c0; --xp:#8cf54a;
  --red:#e5483f; --ink:#fff7e0;
  --px-font:'Press Start 2P','Courier New',monospace;
  --body-font:'Rubik','Segoe UI',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  font-family:var(--body-font); color:var(--ink);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
  overflow-x:hidden;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 3px,transparent 3px 48px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,transparent 3px 48px),
    linear-gradient(180deg,#2c2013 0%,#1b130a 55%,#0d0805 100%);
  min-height:100dvh;
}
.px{font-family:var(--px-font);}
.btn-mc{
  font-family:var(--px-font); font-size:14px; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.6);
  background:linear-gradient(#9c9c9c,#6e6e6e); border:3px solid #000; padding:14px 18px; cursor:pointer;
  box-shadow:inset 0 4px 0 #c9c9c9, inset 0 -6px 0 #4a4a4a, 0 5px 0 #000; transition:transform .05s;
}
.btn-mc:hover{color:#ffe95e; filter:brightness(1.08);}
.btn-mc:active{transform:translateY(4px);}
.btn-green{background:linear-gradient(#71c748,#4c9a2a);}
.btn-gold{background:linear-gradient(#ffcf52,#d99a13); color:#3a2500;}
.btn-red{background:linear-gradient(#e5483f,#b9362e);}

/* HUD */
#hud{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
  padding:10px 12px; background:rgba(0,0,0,.45); border-bottom:4px solid #000;}
.slot{background:#1c1c1c; border:3px solid #000; padding:8px 12px; display:flex; align-items:center; gap:8px;
  font-family:var(--px-font); font-size:13px;}
.xpbar{width:150px; height:14px; background:#111; border:2px solid #000;}
.xpbar i{display:block; height:100%; width:0%; background:linear-gradient(#c4ff6e,#6fce2a); transition:width .4s;}

/* Scene */
#scene{position:relative; width:min(920px,96vw); height:clamp(280px,40vh,380px); margin:14px auto;
  overflow:hidden; border:4px solid #000; background:linear-gradient(180deg,#241a10,#170f08);
  box-shadow:0 8px 0 #000;}
#ground{position:absolute; left:0; right:0; bottom:0; height:36px;
  background:linear-gradient(#67b93c 0 8px,#3f7d22 8px 12px,#7a4f2a 12px 100%); border-top:3px solid #000;}
#miner{position:absolute; left:9%; bottom:36px; font-size:48px;}
#block-wrap{position:absolute; left:50%; bottom:36px; transform:translateX(-50%); text-align:center;}
#block{width:clamp(100px,20vw,150px); height:clamp(100px,20vw,150px); margin:0 auto;
  border:4px solid #000; image-rendering:pixelated;
  box-shadow:inset 0 6px 0 rgba(255,255,255,.22), inset 0 -8px 0 rgba(0,0,0,.35), 0 10px 0 rgba(0,0,0,.4);}
.block--grass{background:linear-gradient(#67b93c 0 22%,#3f7d22 22% 27%,#7a4f2a 27%);}
.block--stone{background:#8d8d8d;}
.block--diamond{background:#43e0c0; box-shadow:0 0 14px rgba(67,224,192,.55);}
.cracks{position:absolute; inset:0;}
.cracks i{position:absolute; inset:0; opacity:0;}
#block.stage-1 .cracks i:nth-child(1){opacity:1;}
#block.stage-2 .cracks i:nth-child(-n+2){opacity:1;}
#block.stage-3 .cracks i{opacity:1;}

/* Quest panel */
#quest{width:min(760px,96vw); margin:14px auto; background:var(--panel);
  border:4px solid #000; padding:18px; text-align:center;}
#equation{font-family:var(--px-font); font-size:clamp(28px,6vw,48px); color:#fff;
  text-shadow:4px 4px 0 #000; margin-bottom:18px;}
#answers{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:560px; margin:0 auto;}
.answer{font-family:var(--px-font); font-size:clamp(18px,4vw,24px); padding:16px 8px; min-height:60px;
  background:linear-gradient(#9c9c9c,#6e6e6e); border:3px solid #000; cursor:pointer;}
.answer.correct{background:linear-gradient(#7ee04e,#3f9a1f) !important;}
.answer.wrong{background:linear-gradient(#e5483f,#b9362e) !important; animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Back button */
#btn-back{position:fixed; top:10px; left:10px; font-size:11px; padding:10px 14px; z-index:100;}
</style>
</head>
<body>

<button class="btn-mc" id="btn-back">← МЕНЮ</button>

<header id="hud">
  <div class="slot">📊 Уровень <span id="hud-level">1</span></div>
  <div class="slot">⭐ <span id="hud-xp">0</span>/<span id="hud-xp-need">50</span></div>
  <div class="slot">💎 <span id="hud-diamonds">0</span></div>
  <div class="slot">🔥 ×<span id="hud-streak">0</span></div>
</header>

<div id="scene">
  <div id="ground"></div>
  <div id="miner">⛏️</div>
  <div id="block-wrap">
    <div id="block" class="block--grass"><div class="cracks"><i></i><i></i><i></i></div></div>
  </div>
</div>

<section id="quest">
  <div id="equation" class="px"></div>
  <div id="answers"></div>
</section>

<script src="multiply.js"></script>
</body>
</html>
